<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Freetown Life</title>
<meta name="description" content="A life sim set in Freetown, Sierra Leone. Walk the city, dodge poda-poda traffic, make friends and build a life.">
<meta name="theme-color" content="#1eb53a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='11' fill='%231eb53a'/%3E%3Crect y='11' width='32' height='10' fill='%23fff'/%3E%3Crect y='21' width='32' height='11' fill='%230072c6'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="head">
  <div class="in">
    <div>
      <h1>Freetown Life</h1>
      <div class="tag">Walk the streets of Salone. Make friends. Build a life.</div>
    </div>
    <div class="clock" id="clock"></div>
  </div>
</div>
<div class="stripe"></div>
<div class="sky" id="sky" data-p="morning" aria-hidden="true">
  <div class="sun" id="sun"></div>
  <div class="place" id="skyplace">Home</div>
  <svg viewBox="0 0 400 52" preserveAspectRatio="none">
    <path fill="#2a8a45" opacity=".8" d="M0 30 Q70 -8 150 22 T300 10 T400 28 V52 H0Z"/>
    <g fill="#14221a">
      <rect x="0" y="34" width="22" height="18"/><rect x="24" y="26" width="16" height="26"/><rect x="42" y="36" width="26" height="16"/>
      <rect x="70" y="20" width="14" height="32"/><rect x="86" y="32" width="24" height="20"/><rect x="112" y="28" width="12" height="24"/>
      <rect x="130" y="38" width="40" height="14"/><rect x="172" y="24" width="18" height="28"/><rect x="192" y="32" width="22" height="20"/>
      <rect x="216" y="16" width="12" height="36"/><rect x="230" y="30" width="26" height="22"/><rect x="258" y="36" width="20" height="16"/>
      <rect x="280" y="26" width="16" height="26"/><rect x="298" y="34" width="24" height="18"/><rect x="324" y="28" width="14" height="24"/>
      <rect x="340" y="38" width="26" height="14"/><rect x="368" y="22" width="14" height="30"/><rect x="384" y="34" width="16" height="18"/>
    </g>
  </svg>
</div>

<div class="wrap">
  <div class="layout" id="layout" hidden>
    <aside class="me" id="me"></aside>
    <main>
      <div class="tabs" role="tablist" id="tabs"></div>
      <div class="stage" id="stage">
        <canvas id="cv" width="480" height="320" aria-label="Top-down map of Freetown. Move with arrow keys or W A S D, or tap to walk."></canvas>
        <div class="pad">
          <div class="dpad">
            <button class="u" data-k="up" aria-label="Up">▲</button>
            <button class="l" data-k="left" aria-label="Left">◀</button>
            <button class="r" data-k="right" aria-label="Right">▶</button>
            <button class="d" data-k="down" aria-label="Down">▼</button>
          </div>
          <div class="acts">
            <button data-k="act">Talk</button>
            <button data-k="sprint">Run</button>
          </div>
        </div>
      </div>
      <p class="hint" id="hint">Walk with arrow keys or W A S D, or tap the map. Hold Shift to run. Press E to talk. Time runs while you walk and pauses on other tabs.</p>
      <div class="panel" id="panel"></div>
      <section class="log" id="logbox"></section>
    </main>
  </div>
</div>
<div id="overlay"></div>

<script src="app.js"></script>
</body>
</html>
